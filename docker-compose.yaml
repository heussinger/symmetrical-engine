services:
  db:
    container_name: postgres-spring-boot
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGData: /data/postgres
      #POSTGRES_DB: demo_db
    ports:
      - "5332:5432"
    volumes:
      - db:/data/postgres    
    networks:
      - db
    restart: unless-stopped
networks:
  db:
    driver: bridge
volumes:
  db:
