services:
  db:
    container_name: postgres-spring-boot
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
    #ports:
    #- "5332:5432"
    volumes:
      - db:/data/postgres    
    networks:
      - db-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: app-spring-boot
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/user
      SPRING_DATASOURCE_USER: user
      SPRING_DATASOURCE_PASSWORD: password
    networks:
      - db-app

networks:
  db-app:
    driver: bridge

volumes:
  db:



