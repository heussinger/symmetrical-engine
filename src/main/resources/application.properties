spring.application.name=spring-boot-demo
# Local development defaults only. Real credentials are supplied via environment
# variables (SPRING_DATASOURCE_*, USER_PWD, ADMIN_PWD) and must never be committed.
spring.datasource.url=jdbc:postgresql://localhost:5332/user
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

